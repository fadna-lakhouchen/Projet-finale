<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion Utilisateurs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-50 dark:bg-neutral-900">
    <!-- ========== SIDEBAR ========== -->
    <aside
        class="fixed top-0 start-0 bottom-0 z-[60] w-64 bg-slate-900 border-e border-slate-800 pt-7 pb-10 overflow-y-auto lg:block hidden">
        <div class="px-6 mb-8 flex items-center gap-x-3">
            <div class="size-8 bg-blue-500 rounded-lg flex items-center justify-center text-white"><i
                    data-lucide="shield-check" class="size-5"></i></div>
            <span class="text-xl font-bold text-white">AdminHub</span>
        </div>
        <nav class="p-6 w-full flex flex-col flex-wrap">
            <ul class="space-y-1.5">
                <li><a class="flex items-center gap-x-3.5 py-2 px-2.5 text-slate-400 rounded-lg hover:bg-slate-800 hover:text-white"
                        href="index.html"><i data-lucide="layout-grid" class="size-4"></i> Vue d'ensemble</a></li>
                <li><a class="flex items-center gap-x-3.5 py-2 px-2.5 bg-blue-600 text-sm text-white rounded-lg"
                        href="users.html"><i data-lucide="users" class="size-4"></i> Utilisateurs</a></li>
                <li><a class="flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-slate-400 rounded-lg hover:bg-slate-800 hover:text-white"
                        href="logs.html"><i data-lucide="terminal" class="size-4"></i> Logs Système</a></li>
            </ul>
        </nav>
    </aside>

    <main class="w-full lg:ps-64">
        <header class="sticky top-0 inset-x-0 bg-white border-b py-4 px-6 dark:bg-neutral-800 dark:border-neutral-700">
            <h1 class="text-lg font-bold text-gray-800 dark:text-white">Annuaire des Utilisateurs</h1>
        </header>

        <div class="p-6">
            <div class="bg-white border rounded-xl dark:bg-neutral-800">
                <div class="p-4 border-b flex justify-between items-center bg-gray-50 dark:bg-neutral-900">
                    <input type="text" class="py-2 px-4 border rounded-lg text-sm w-80"
                        placeholder="Rechercher par nom, email, rôle...">
                    <button class="py-2 px-4 bg-blue-600 text-white text-sm font-bold rounded-lg">+ Nouvel
                        Admin</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Utilisateur
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Rôle</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Statut</th>
                                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 flex items-center gap-3">
                                    <img class="size-8 rounded-full" src="https://ui-avatars.com/api/?name=Ahmed+Benali"
                                        alt="">
                                    <div>
                                        <p class="text-sm font-bold">Ahmed Benali</p>
                                        <p class="text-[10px] text-gray-400">ahmed@example.com</p>
                                    </div>
                                </td>
                                <td class="px-6 py-4"><span
                                        class="px-2 py-1 bg-teal-100 text-teal-800 text-[10px] font-bold rounded">RÉSIDENT</span>
                                </td>
                                <td class="px-6 py-4"><span
                                        class="size-2 bg-green-500 rounded-full inline-block mr-2"></span><span
                                        class="text-xs">Actif</span></td>
                                <td class="px-6 py-4 text-right italic text-xs text-blue-600">Modifier</td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 flex items-center gap-3">
                                    <img class="size-8 rounded-full"
                                        src="https://ui-avatars.com/api/?name=Youssef+El+Khadir" alt="">
                                    <div>
                                        <p class="text-sm font-bold">Youssef El Khadir</p>
                                        <p class="text-[10px] text-gray-400">youssef@syndic.ma</p>
                                    </div>
                                </td>
                                <td class="px-6 py-4"><span
                                        class="px-2 py-1 bg-blue-100 text-blue-800 text-[10px] font-bold rounded">SYNDIC</span>
                                </td>
                                <td class="px-6 py-4"><span
                                        class="size-2 bg-green-500 rounded-full inline-block mr-2"></span><span
                                        class="text-xs">Actif</span></td>
                                <td class="px-6 py-4 text-right italic text-xs text-blue-600">Modifier</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>

</html>
