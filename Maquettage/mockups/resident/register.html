<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImmoSyndic - Inscription Résident</title>
    
    <!-- Tailwind & Preline -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Outfit', 'Plus Jakarta Sans', 'Inter', 'sans-serif'] 
                    },
                    colors: { 
                        primary: { 
                            50: '#f5f7ff', 
                            100: '#ebf0fe', 
                            200: '#ced9fd', 
                            300: '#b1c2fb', 
                            400: '#7694f8', 
                            500: '#3b66f5', 
                            600: '#2c4db8', 
                            700: '#1d3278', 
                            800: '#152559', 
                            900: '#0e193c' 
                        },
                        slate: {
                            950: '#090D16'
                        }
                    },
                    boxShadow: {
                        'premium': '0 10px 30px -10px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.01)',
                        'premium-hover': '0 20px 40px -15px rgba(59, 102, 245, 0.1), 0 1px 2px rgba(59, 102, 245, 0.02)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.04)',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Visual Polish (Zwaq) -->
    <style>
        .logo-transparent { mix-blend-mode: multiply; }
        [x-cloak] { display: none !important; }
        
        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Fine Scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.25);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.45);
        }
        
        /* Animated Ring/Glow transitions */
        .glow-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-hover:hover {
            box-shadow: 0 0 20px 2px rgba(59, 102, 245, 0.15);
            transform: translateY(-1px);
        }
        
        /* Fallback for Preline overlays */
        .hs-overlay.open { pointer-events: auto !important; }
        .hs-overlay.open>div { opacity: 1 !important; margin-top: 1.75rem !important; }
        
    </style>

</head>

<body class="bg-[#F8FAFC] text-slate-800 dark:bg-[#080B11] dark:text-neutral-200 min-h-screen transition-colors duration-300 flex min-h-screen items-center justify-center p-4">
    <main class="w-full max-w-xl mx-auto my-8">
        <!-- Card -->
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-neutral-900 dark:border-neutral-700">
            <div class="p-4 sm:p-7">
                <div class="text-center">
                    <div class="flex justify-center mb-4">
                        <div
                            class="size-12 bg-primary-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                            <i data-lucide="user-plus" class="size-6"></i>
                        </div>
                    </div>
                    <h1 class="block text-2xl font-bold text-gray-800 dark:text-white">Rejoindre la copropriété</h1>
                    <p class="mt-2 text-sm text-gray-600 dark:text-neutral-400">
                        Vous avez déjà un compte ?
                        <a class="text-primary-600 decoration-2 hover:underline font-medium dark:text-primary-500"
                            href="login.html">
                            Se connecter
                        </a>
                    </p>
                </div>

                <div class="mt-8">
                    <!-- Form -->
                    <form action="dashboard.html" method="GET">
                        <div class="grid gap-y-4">

                            <!-- Immeuble Auto-filled -->
                            <div>
                                <label for="residence"
                                    class="block text-sm mb-2 dark:text-white font-semibold">Résidence
                                    (Invitation)</label>
                                <div class="relative">
                                    <div
                                        class="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20 ps-4">
                                        <i data-lucide="building" class="size-4 text-gray-400"></i>
                                    </div>
                                    <input type="text" id="residence" name="residence"
                                        class="py-3 px-4 ps-11 block w-full border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600 bg-gray-50 font-medium"
                                        value="Résidence Al Amal" readonly disabled>
                                </div>
                                <p class="text-xs text-gray-500 mt-2">Ce champ est prérempli grâce à votre lien
                                    d'invitation.</p>
                            </div>

                            <hr class="my-2 border-gray-200 dark:border-neutral-700">

                            <!-- Form Group -->
                            <div>
                                <label for="name" class="block text-sm mb-2 dark:text-white">Nom complet</label>
                                <input type="text" id="name" name="name"
                                    class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                                    required placeholder="Hassan Afaiz">
                            </div>
                            <!-- End Form Group -->

                            <!-- Form Group -->
                            <div>
                                <label for="email" class="block text-sm mb-2 dark:text-white">Adresse Email</label>
                                <input type="email" id="email" name="email"
                                    class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                                    required placeholder="exemple@email.com">
                            </div>
                            <!-- End Form Group -->

                            <!-- Form Group -->
                            <div>
                                <label for="password" class="block text-sm mb-2 dark:text-white">Mot de passe</label>
                                <input type="password" id="password" name="password"
                                    class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                                    required placeholder="••••••••">
                            </div>
                            <!-- End Form Group -->

                            <!-- Role Selection -->
                            <div>
                                <label class="block text-sm mb-2 dark:text-white">Je suis :</label>
                                <div class="grid sm:grid-cols-2 gap-2">
                                    <label for="role-locataire"
                                        class="flex p-3 w-full bg-white border border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 cursor-pointer hover:bg-gray-50 transition-colors">
                                        <input type="radio" name="role" id="role-locataire"
                                            class="shrink-0 mt-0.5 border-gray-300 rounded-full text-primary-600 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:checked:bg-primary-500 dark:checked:border-primary-500 dark:focus:ring-offset-gray-800"
                                            checked>
                                        <span
                                            class="text-sm text-gray-500 ms-3 dark:text-neutral-400 font-medium">Locataire</span>
                                    </label>

                                    <label for="role-proprietaire"
                                        class="flex p-3 w-full bg-white border border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 cursor-pointer hover:bg-gray-50 transition-colors">
                                        <input type="radio" name="role" id="role-proprietaire"
                                            class="shrink-0 mt-0.5 border-gray-300 rounded-full text-primary-600 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:checked:bg-primary-500 dark:checked:border-primary-500 dark:focus:ring-offset-gray-800">
                                        <span
                                            class="text-sm text-gray-500 ms-3 dark:text-neutral-400 font-medium">Propriétaire</span>
                                    </label>
                                </div>
                            </div>
                            <!-- End Role Selection -->

                            <!-- Checkbox -->
                            <div class="flex items-center mt-2">
                                <div class="flex">
                                    <input id="terms" name="terms" type="checkbox"
                                        class="shrink-0 mt-0.5 border-gray-200 rounded text-primary-600 focus:ring-primary-500 dark:bg-neutral-800 dark:border-neutral-700 dark:checked:bg-primary-500 dark:checked:border-primary-500 dark:focus:ring-offset-gray-800"
                                        required>
                                </div>
                                <div class="ms-3">
                                    <label for="terms" class="text-sm dark:text-white">J'accepte les <a
                                            class="text-primary-600 decoration-2 hover:underline font-medium dark:text-primary-500"
                                            href="#">conditions d'utilisation</a></label>
                                </div>
                            </div>
                            <!-- End Checkbox -->

                            <button type="submit"
                                class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-50 disabled:pointer-events-none mt-4 transition-colors">
                                Créer mon compte
                            </button>
                        </div>
                    </form>
                    <!-- End Form -->
                </div>
            </div>
        </div>
        <!-- End Card -->
    </main>

        <script>
        lucide.createIcons();
        window.addEventListener('load', () => {
            if (window.HSStaticMethods) {
                window.HSStaticMethods.autoInit();
            }
        });
    </script>
</body>

</html>
