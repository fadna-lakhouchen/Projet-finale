<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImmoSyndic - Ma Résidence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-50 dark:bg-neutral-900">
    <!-- Header/Sidebar from Resident Suite -->
    <header class="sticky top-0 inset-x-0 bg-white border-b py-4 px-6 lg:ps-64">
        <h2 class="text-sm font-semibold text-gray-800">Informations sur la Résidence</h2>
    </header>

    <div
        class="sticky top-0 start-0 lg:fixed lg:bottom-0 lg:z-[60] size-full w-64 bg-white border-e pt-7 pb-10 lg:block hidden">
        <div class="px-6 flex items-center gap-x-3 mb-8">
            <div class="size-8 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i
                    data-lucide="building-2" class="size-5"></i></div>
            <span class="text-xl font-bold">ImmoSyndic</span>
        </div>
        <nav class="p-6 space-y-1.5 text-sm">
            <a href="index.html" class="block p-2 text-gray-700 rounded-lg hover:bg-gray-100 italic">Dashboard</a>
            <a href="residence.html" class="block p-2 bg-gray-100 text-blue-600 font-bold rounded-lg">Ma Résidence</a>
        </nav>
    </div>

    <main class="w-full lg:ps-64 p-6">
        <div class="grid lg:grid-cols-2 gap-6">
            <div class="bg-white border rounded-xl p-6 shadow-sm">
                <h3 class="font-bold text-lg mb-4">Contacts Utiles</h3>
                <div class="space-y-4">
                    <div class="flex items-center gap-3">
                        <div class="size-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center"><i
                                data-lucide="phone"></i></div>
                        <div>
                            <p class="text-xs font-bold text-gray-400">Concierge</p>
                            <p class="text-sm font-bold">M. Said - 06 12 34 56 78</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="size-10 bg-red-50 text-red-600 rounded-full flex items-center justify-center"><i
                                data-lucide="ambulance"></i></div>
                        <div>
                            <p class="text-xs font-bold text-gray-400">Urgence Technique</p>
                            <p class="text-sm font-bold">05 39 88 77 66</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white border rounded-xl p-6 shadow-sm">
                <h3 class="font-bold text-lg mb-4">Équipements</h3>
                <ul class="space-y-3">
                    <li class="flex items-center gap-2 text-sm text-gray-600"><i data-lucide="check-circle"
                            class="size-4 text-teal-500"></i> Piscine (Ouverte 09h-20h)</li>
                    <li class="flex items-center gap-2 text-sm text-gray-600"><i data-lucide="check-circle"
                            class="size-4 text-teal-500"></i> Salle de sport (Niveau -1)</li>
                </ul>
            </div>
        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>

</html>
