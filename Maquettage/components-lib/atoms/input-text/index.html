<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <title>Atom: Input Text </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 flex flex-col gap-6 max-w-sm dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-2 border-b pb-4 dark:text-white">Input Text </h2>

    <div>
        <label for="input-label" class="block text-sm font-medium mb-2 dark:text-white">Nom complet</label>
        <input type="text" id="input-label"
            class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
            placeholder="ex: Ahmed Alami">
    </div>

    <div>
        <label for="input-label-disabled" class="block text-sm font-medium mb-2 dark:text-white">Désactivé</label>
        <input type="text" id="input-label-disabled"
            class="py-3 px-4 block w-full border-gray-200 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
            placeholder="Lecture seule" disabled value="A12 - Résidence Al Amal">
    </div>

</body>

</html>
