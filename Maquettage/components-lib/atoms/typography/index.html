<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <title>Atom: Typography </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 flex flex-col gap-6 max-w-2xl dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-4 dark:text-white">Typography </h2>

    <div class="space-y-4">
        <h1 class="text-2xl font-bold md:text-3xl dark:text-white">Heading 1</h1>
        <h2 class="text-xl font-bold md:text-2xl dark:text-white">Heading 2</h2>
        <h3 class="text-lg font-bold md:text-xl dark:text-white">Heading 3</h3>
    </div>

    <hr class="border-gray-200 dark:border-neutral-700">

    <div class="space-y-4">
        <p class="text-lg text-gray-800 dark:text-neutral-200">This is a large body text.</p>
        <p class="text-gray-800 dark:text-neutral-200">This is a normal body text.</p>
        <p class="text-sm text-gray-500 dark:text-neutral-500">This is a small body text.</p>
        <p class="text-xs text-gray-400 dark:text-neutral-600">This is an extra small metadata text.</p>
    </div>

</body>

</html>
