<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <title>Atom: Input Number </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 flex flex-col gap-4 max-w-sm dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-4 dark:text-white">Input Number </h2>

    <div class="relative">
        <input type="number"
            class="py-3 px-4 pe-16 block w-full border-gray-200 shadow-sm rounded-lg text-sm focus:z-10 focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
            placeholder="0.00">
        <div class="absolute inset-y-0 end-0 flex items-center pointer-events-none pe-4">
            <span class="text-gray-500 dark:text-neutral-500">MAD</span>
        </div>
    </div>

</body>

</html>
