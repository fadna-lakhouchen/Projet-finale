<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Atom: Icon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 flex flex-col gap-8 max-w-sm">

    <h2 class="text-xl font-semibold mb-4 border-b pb-2">Atom: Icon (Lucide)</h2>

    <div class="flex gap-4 items-center">
        <div class="flex flex-col items-center gap-2">
            <i data-lucide="home" class="w-6 h-6 text-gray-700"></i>
            <span class="text-xs text-gray-500">Normal</span>
        </div>

        <div class="flex flex-col items-center gap-2">
            <i data-lucide="bell" class="w-6 h-6 text-blue-600"></i>
            <span class="text-xs text-gray-500">Primary</span>
        </div>

        <div class="flex flex-col items-center gap-2">
            <i data-lucide="check-circle" class="w-6 h-6 text-green-600"></i>
            <span class="text-xs text-gray-500">Success</span>
        </div>

        <div class="flex flex-col items-center gap-2">
            <i data-lucide="alert-triangle" class="w-6 h-6 text-red-600"></i>
            <span class="text-xs text-gray-500">Danger</span>
        </div>

        <!-- Small icon for buttons typically -->
        <div class="flex flex-col items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4 text-gray-700"></i>
            <span class="text-xs text-gray-500">Small</span>
        </div>
    </div>

    <p class="text-sm text-gray-500 italic mt-4">
        L'atome Icon est un wrapper qui utilise la police d'icône (ici SVG Lucide via data-lucide) stylisé avec
        l'utilitaire de taille et de couleur de TailwindCSS.
    </p>

    <script>lucide.createIcons();</script>
</body>

</html>
