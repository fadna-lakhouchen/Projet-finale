<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Atom: Avatar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 flex flex-wrap gap-8 items-start">

    <h2 class="text-xl font-semibold mb-4 border-b pb-2 w-full">Atom: Avatar</h2>

    <!-- Image -->
    <div class="flex flex-col items-center gap-2">
        <img class="w-10 h-10 rounded-full object-cover ring-2 ring-white shadow-sm"
            src="https://ui-avatars.com/api/?name=John+Doe&background=0D8ABC&color=fff" alt="User Image">
        <span class="text-xs text-gray-500">Image</span>
    </div>

    <!-- Initiales -->
    <div class="flex flex-col items-center gap-2">
        <div
            class="relative inline-flex items-center justify-center w-10 h-10 overflow-hidden bg-blue-100 rounded-full ring-2 ring-white shadow-sm">
            <span class="font-medium text-blue-600">JD</span>
        </div>
        <span class="text-xs text-gray-500">Initiales</span>
    </div>

    <!-- Placeholder Icon -->
    <div class="flex flex-col items-center gap-2">
        <div
            class="relative inline-flex items-center justify-center w-10 h-10 overflow-hidden bg-gray-100 rounded-full ring-2 ring-white shadow-sm">
            <i data-lucide="user" class="w-5 h-5 text-gray-500"></i>
        </div>
        <span class="text-xs text-gray-500">Par défaut</span>
    </div>

    <!-- Avec badge de statut en ligne (actif) -->
    <div class="flex flex-col items-center gap-2">
        <div class="relative">
            <img class="w-10 h-10 rounded-full object-cover ring-2 ring-white shadow-sm"
                src="https://ui-avatars.com/api/?name=Jane+Doe&background=10B981&color=fff" alt="">
            <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-500">Avec statut</span>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
