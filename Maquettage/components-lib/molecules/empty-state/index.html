<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Empty State </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 flex items-center justify-center dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 absolute top-8 left-8 border-b pb-4 dark:text-white">Empty State </h2>

    <div
        class="flex flex-col bg-white border shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 dark:shadow-neutral-700/70 max-w-md w-full">
        <div class="p-4 md:p-10 text-center">
            <div
                class="size-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 dark:bg-blue-800/20 dark:text-blue-500">
                <i data-lucide="check-circle-2" class="size-10"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 dark:text-white">
                Tout est à jour !
            </h3>
            <p class="mt-2 text-sm text-gray-600 dark:text-neutral-400">
                Vous n'avez aucune charge en attente de paiement pour le moment. Nous vous préviendrons lors de la
                prochaine échéance.
            </p>
            <div class="mt-6 flex justify-center">
                <button type="button"
                    class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
                    <i data-lucide="history" class="size-4"></i>
                    Voir l'historique
                </button>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
