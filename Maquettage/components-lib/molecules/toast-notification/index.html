<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Toast Notification </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-200 h-screen overflow-hidden relative dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4 absolute top-8 left-8 dark:text-white">Toast
        Notification </h2>

    <div class="fixed top-5 end-5 z-[100] grid gap-y-3">
        <!-- Success Toast -->
        <div id="hs-toast-success-example"
            class="max-w-xs bg-white border border-gray-200 rounded-xl shadow-lg dark:bg-neutral-800 dark:border-neutral-700"
            role="alert" tabindex="-1">
            <div class="flex p-4">
                <div class="shrink-0">
                    <i data-lucide="check-circle" class="shrink-0 size-4 text-teal-500 mt-0.5"></i>
                </div>
                <div class="ms-3">
                    <p class="text-sm text-gray-700 dark:text-neutral-400">
                        L'opération a été effectuée avec succès.
                    </p>
                </div>
                <div class="ms-auto">
                    <button type="button"
                        class="inline-flex shrink-0 justify-center items-center size-5 rounded-lg text-gray-800 opacity-50 hover:opacity-100 focus:outline-none focus:opacity-100 dark:text-white"
                        data-hs-remove-element="#hs-toast-success-example">
                        <span class="sr-only">Close</span>
                        <i data-lucide="x" class="shrink-0 size-4"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Error Toast -->
        <div id="hs-toast-error-example"
            class="max-w-xs bg-white border border-gray-200 rounded-xl shadow-lg dark:bg-neutral-800 dark:border-neutral-700"
            role="alert" tabindex="-1">
            <div class="flex p-4">
                <div class="shrink-0">
                    <i data-lucide="alert-circle" class="shrink-0 size-4 text-red-500 mt-0.5"></i>
                </div>
                <div class="ms-3">
                    <p class="text-sm text-gray-700 dark:text-neutral-400">
                        Erreur serveur : Impossible d'enregistrer les modifications.
                    </p>
                </div>
                <div class="ms-auto">
                    <button type="button"
                        class="inline-flex shrink-0 justify-center items-center size-5 rounded-lg text-gray-800 opacity-50 hover:opacity-100 focus:outline-none focus:opacity-100 dark:text-white"
                        data-hs-remove-element="#hs-toast-error-example">
                        <span class="sr-only">Close</span>
                        <i data-lucide="x" class="shrink-0 size-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
