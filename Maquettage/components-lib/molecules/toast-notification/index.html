<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Toast Notification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-200 h-screen overflow-hidden relative">

    <h2 class="text-xl font-semibold mb-6 border-b pb-2 absolute top-8 left-8">Molecule: Toast Notification (Flottant)
    </h2>

    <!-- Container for Toasts -->
    <div class="fixed top-5 right-5 z-50 flex flex-col gap-3">

        <!-- Success Toast -->
        <div id="toast-success"
            class="flex items-center w-full max-w-xs p-4 text-gray-500 bg-white rounded-lg shadow-lg border border-gray-100"
            role="alert">
            <div
                class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-green-500 bg-green-100 rounded-lg">
                <i data-lucide="check" class="w-5 h-5"></i>
                <span class="sr-only">Check icon</span>
            </div>
            <div class="ml-3 text-sm font-normal"><span class="font-semibold text-gray-900 block">Succès</span>Opération
                effectuée.</div>
            <button type="button"
                class="ml-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8"
                data-dismiss-target="#toast-success" aria-label="Close">
                <span class="sr-only">Close</span>
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Error Toast -->
        <div id="toast-danger"
            class="flex items-center w-full max-w-xs p-4 text-gray-500 bg-white rounded-lg shadow-lg border border-gray-100"
            role="alert">
            <div
                class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-red-500 bg-red-100 rounded-lg">
                <i data-lucide="alert-circle" class="w-5 h-5"></i>
                <span class="sr-only">Error icon</span>
            </div>
            <div class="ml-3 text-sm font-normal"><span class="font-semibold text-gray-900 block">Erreur
                    serveur</span>Impossible d'enregistrer.</div>
            <button type="button"
                class="ml-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8"
                data-dismiss-target="#toast-danger" aria-label="Close">
                <span class="sr-only">Close</span>
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
