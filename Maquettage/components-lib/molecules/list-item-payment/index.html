<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molecule: List Item Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 max-w-lg">

    <h2 class="text-xl font-semibold mb-6 border-b pb-2">Molecule: List Item Payment</h2>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <ul class="divide-y divide-gray-100">

            <!-- Ligne de paiement success -->
            <li class="flex items-center justify-between p-4 hover:bg-gray-50 transition-colors">
                <div class="flex items-center gap-4">
                    <div
                        class="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center text-green-600 flex-shrink-0">
                        <i data-lucide="check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-gray-900">Charges T1 2026</p>
                        <p class="text-xs text-gray-500">Prélèvement automatique • 01 Jan 2026</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-sm font-bold text-gray-900">-400 MAD</p>
                    <span
                        class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-medium bg-green-100 text-green-800">
                        Payé
                    </span>
                </div>
            </li>

            <!-- Ligne de paiement attente -->
            <li class="flex items-center justify-between p-4 bg-yellow-50/30 hover:bg-yellow-50 transition-colors">
                <div class="flex items-center gap-4">
                    <div
                        class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center text-yellow-600 flex-shrink-0">
                        <i data-lucide="clock" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-gray-900">Charges T2 2026</p>
                        <p class="text-xs text-gray-500">Échéance : 01 Avr 2026</p>
                    </div>
                </div>
                <div class="text-right flex items-center gap-3">
                    <div>
                        <p class="text-sm font-bold text-gray-900 text-right">400 MAD</p>
                        <span
                            class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-medium bg-yellow-100 text-yellow-800">
                            À payer
                        </span>
                    </div>
                    <button
                        class="p-2 text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors flex-shrink-0">
                        <i data-lucide="credit-card" class="w-4 h-4"></i>
                    </button>
                </div>
            </li>

        </ul>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
