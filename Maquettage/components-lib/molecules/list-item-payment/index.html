<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: List Item Payment </title>
    
    <!-- Tailwind & Preline -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Outfit', 'Plus Jakarta Sans', 'Inter', 'sans-serif'] 
                    },
                    colors: { 
                        primary: { 
                            50: '#f5f7ff', 
                            100: '#ebf0fe', 
                            200: '#ced9fd', 
                            300: '#b1c2fb', 
                            400: '#7694f8', 
                            500: '#3b66f5', 
                            600: '#2c4db8', 
                            700: '#1d3278', 
                            800: '#152559', 
                            900: '#0e193c' 
                        },
                        slate: {
                            950: '#090D16'
                        }
                    },
                    boxShadow: {
                        'premium': '0 10px 30px -10px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.05)',
                        'premium-hover': '0 20px 40px -15px rgba(59, 102, 245, 0.25), 0 1px 2px rgba(59, 102, 245, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.35);
        }
    </style>

</head>

<body class="p-8 bg-[#080B11] text-slate-200 min-h-screen font-sans max-w-lg dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4 dark:text-white">List Item Payment </h2>

    <div
        class="flex flex-col bg-white border shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 dark:shadow-neutral-700/70">
        <div class="p-4 md:p-5">
            <ul class="flex flex-col divide-y divide-gray-200 dark:divide-neutral-700">
                <!-- Ligne de paiement success -->
                <li
                    class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium text-gray-800 dark:text-white">
                    <div class="flex justify-between w-full items-center">
                        <div class="flex items-center gap-x-3">
                            <span
                                class="size-8 flex justify-center items-center rounded-full bg-teal-100 text-teal-800 dark:bg-teal-900/30 dark:text-teal-500">
                                <i data-lucide="check" class="size-4"></i>
                            </span>
                            <div>
                                <span class="block font-semibold">Charges T1 2026</span>
                                <span class="block text-xs text-gray-500 dark:text-neutral-500">Prélèvement automatique
                                    • 01 Jan 2026</span>
                            </div>
                        </div>
                        <div class="text-end">
                            <span class="block font-bold">-400 MAD</span>
                            <span
                                class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-[10px] font-medium bg-teal-100 text-teal-800 dark:bg-teal-800/20 dark:text-teal-500">Payé</span>
                        </div>
                    </div>
                </li>

                <!-- Ligne de paiement attente -->
                <li
                    class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium text-gray-800 dark:text-white bg-yellow-50/50 dark:bg-yellow-900/10 transition hover:bg-yellow-50 dark:hover:bg-yellow-900/20">
                    <div class="flex justify-between w-full items-center">
                        <div class="flex items-center gap-x-3">
                            <span
                                class="size-8 flex justify-center items-center rounded-full bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-500">
                                <i data-lucide="clock" class="size-4"></i>
                            </span>
                            <div>
                                <span class="block font-semibold">Charges T2 2026</span>
                                <span class="block text-xs text-gray-500 dark:text-neutral-500">Échéance : 01 Avr
                                    2026</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-x-4">
                            <div class="text-end">
                                <span class="block font-bold text-gray-800 dark:text-neutral-200">400 MAD</span>
                                <span
                                    class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-[10px] font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-800/20 dark:text-yellow-500">À
                                    payer</span>
                            </div>
                            <button type="button"
                                class="size-8 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-primary-500 text-white hover:bg-primary-600 disabled:opacity-50 disabled:pointer-events-none">
                                <i data-lucide="credit-card" class="size-4"></i>
                            </button>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

        <script>
        lucide.createIcons();
        window.addEventListener('load', () => {
            if (window.HSStaticMethods) {
                window.HSStaticMethods.autoInit();
            }
        });
    </script>
</body>

</html>
