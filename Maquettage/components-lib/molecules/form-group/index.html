<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Form Group </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 max-w-sm dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4 dark:text-white">Form Group </h2>

    <!-- Standard State -->
    <div class="max-w-sm mb-6">
        <label for="hs-with-leading-icon-email" class="block text-sm font-medium mb-2 dark:text-white">Adresse
            Email</label>
        <div class="relative">
            <input type="email" id="hs-with-leading-icon-email" name="hs-with-leading-icon-email"
                class="py-3 px-4 ps-11 block w-full border-gray-200 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                placeholder="exemple@domaine.com">
            <div class="absolute inset-y-0 start-0 flex items-center pointer-events-none ps-4">
                <i data-lucide="mail" class="shrink-0 size-4 text-gray-400 dark:text-neutral-600"></i>
            </div>
        </div>
        <p class="mt-2 text-xs text-gray-500 dark:text-neutral-500">Nous ne partagerons jamais votre email.</p>
    </div>

    <!-- Error State -->
    <div class="max-w-sm">
        <label for="hs-validation-name-error" class="block text-sm font-medium mb-2 dark:text-white">Mot de
            passe</label>
        <div class="relative">
            <input type="password" id="hs-validation-name-error" name="hs-validation-name-error"
                class="py-3 px-4 block w-full border-red-500 rounded-lg text-sm focus:border-red-500 focus:ring-red-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
                required aria-describedby="hs-validation-name-error-helper">
            <div class="absolute inset-y-0 end-0 flex items-center pointer-events-none pe-3">
                <i data-lucide="alert-circle" class="shrink-0 size-4 text-red-500"></i>
            </div>
        </div>
        <p class="text-sm text-red-600 mt-2" id="hs-validation-name-error-helper">Le mot de passe doit contenir au moins
            8 caractères.</p>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
