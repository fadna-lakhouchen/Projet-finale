<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Nav Item </title>
    
    <!-- Tailwind & Preline -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Outfit', 'Plus Jakarta Sans', 'Inter', 'sans-serif'] 
                    },
                    colors: { 
                        primary: { 
                            50: '#f5f7ff', 
                            100: '#ebf0fe', 
                            200: '#ced9fd', 
                            300: '#b1c2fb', 
                            400: '#7694f8', 
                            500: '#3b66f5', 
                            600: '#2c4db8', 
                            700: '#1d3278', 
                            800: '#152559', 
                            900: '#0e193c' 
                        },
                        slate: {
                            950: '#090D16'
                        }
                    },
                    boxShadow: {
                        'premium': '0 10px 30px -10px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.05)',
                        'premium-hover': '0 20px 40px -15px rgba(59, 102, 245, 0.25), 0 1px 2px rgba(59, 102, 245, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.35);
        }
    </style>

</head>

<body class="p-8 bg-[#080B11] text-slate-200 min-h-screen font-sans flex flex-col gap-12 max-w-sm dark:bg-neutral-900">

    <!-- Desktop Sidebar Item -->
    <div
        class="flex flex-col bg-white border shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 dark:shadow-neutral-700/70 p-4">
        <h3 class="text-sm font-bold text-gray-800 dark:text-white mb-4">Sidebar Web </h3>
        <nav class="space-y-1">
            <!-- Actif -->
            <a class="flex items-center gap-x-3.5 py-2 px-2.5 bg-gray-100 text-sm text-gray-800 rounded-lg hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:bg-neutral-700 dark:text-white"
                href="#">
                <i data-lucide="home" class="shrink-0 size-4"></i>
                Tableau de bord
            </a>

            <!-- Inactif -->
            <a class="flex items-center gap-x-3.5 py-2 px-2.5 text-sm text-gray-700 rounded-lg hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:text-neutral-400 dark:hover:text-neutral-300 dark:hover:bg-neutral-800"
                href="#">
                <i data-lucide="credit-card" class="shrink-0 size-4"></i>
                Paiements
                <span
                    class="ms-auto py-0.5 px-1.5 inline-flex items-center gap-x-1.5 text-xs font-medium bg-red-100 text-red-800 rounded-full dark:bg-red-800/10 dark:text-red-500">3</span>
            </a>
        </nav>
    </div>

    <!-- Mobile Navigation Bar -->
    <div
        class="bg-white border-t border-gray-200 dark:bg-neutral-900 dark:border-neutral-700 p-2 fixed bottom-0 left-0 right-0">
        <h3 class="text-center text-[10px] text-gray-400 mb-2 uppercase font-bold tracking-widest">Mobile Tabbar Item
        </h3>
        <div class="flex justify-around items-center">
            <!-- Actif -->
            <a class="flex flex-col items-center gap-y-1 p-2 text-primary-500" href="#">
                <i data-lucide="home" class="size-6"></i>
                <span class="text-[10px] font-medium">Accueil</span>
            </a>

            <!-- Inactif -->
            <a class="flex flex-col items-center gap-y-1 p-2 text-gray-500 hover:text-primary-500 dark:text-neutral-500 dark:hover:text-primary-500"
                href="#">
                <div class="relative">
                    <i data-lucide="alert-triangle" class="size-6"></i>
                    <span
                        class="absolute -top-1 -right-1 size-2.5 bg-red-600 border-2 border-white rounded-full dark:border-neutral-900"></span>
                </div>
                <span class="text-[10px] font-medium">Incidents</span>
            </a>
        </div>
    </div>

        <script>
        lucide.createIcons();
        window.addEventListener('load', () => {
            if (window.HSStaticMethods) {
                window.HSStaticMethods.autoInit();
            }
        });
    </script>
</body>

</html>
