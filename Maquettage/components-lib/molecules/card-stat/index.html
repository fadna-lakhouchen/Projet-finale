<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Card Stat </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 max-w-sm dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4 dark:text-white">Card Stat </h2>

    <div
        class="flex flex-col bg-white border shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 dark:shadow-neutral-700/70">
        <div class="p-4 md:p-5 flex justify-between items-start">
            <div>
                <p class="text-sm font-medium text-gray-500 dark:text-neutral-500 mb-1">Total à payer</p>
                <div class="flex items-center gap-x-2">
                    <h3 class="text-xl sm:text-2xl font-bold text-gray-800 dark:text-neutral-200">
                        4 250 MAD
                    </h3>
                </div>
                <div class="mt-1 flex items-center gap-x-2">
                    <span
                        class="inline-flex items-center gap-x-1 py-0.5 px-2 rounded-md text-xs font-medium bg-red-100 text-red-800 dark:bg-red-800/10 dark:text-red-500">
                        <i data-lucide="arrow-up-right" class="size-3"></i>
                        12%
                    </span>
                    <span class="text-xs text-gray-500 dark:text-neutral-500">vs mois dernier</span>
                </div>
            </div>

            <div
                class="size-11 flex justify-center items-center bg-blue-100 text-blue-600 rounded-lg dark:bg-blue-800/20 dark:text-blue-500">
                <i data-lucide="wallet" class="size-6"></i>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
