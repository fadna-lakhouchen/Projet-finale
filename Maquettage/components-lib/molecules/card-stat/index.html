<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Card Stat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 max-w-sm">

    <h2 class="text-xl font-semibold mb-6 border-b pb-2">Molecule: Card Stat (Dashboard)</h2>

    <!-- Stat Card -->
    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 flex items-start justify-between">
        <div>
            <p class="text-sm font-medium text-gray-500 mb-1">Total à payer</p>
            <h3 class="text-2xl font-bold text-gray-900">4 250 MAD</h3>

            <!-- Évolution -->
            <div class="mt-2 flex items-center text-sm">
                <span class="inline-flex items-center text-red-600 bg-red-50 px-2 py-0.5 rounded-md font-medium">
                    <i data-lucide="arrow-up-right" class="w-3 h-3 mr-1"></i>
                    12%
                </span>
                <span class="ml-2 text-gray-500">depuis le mois dernier</span>
            </div>
        </div>

        <!-- Icône d'illustration -->
        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
            <i data-lucide="wallet" class="w-6 h-6"></i>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
