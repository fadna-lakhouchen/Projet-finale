<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Card Document </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 flex flex-col gap-4 max-w-sm dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4 dark:text-white">Card Document </h2>

    <div
        class="flex flex-col bg-white border shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 dark:shadow-neutral-700/70">
        <div class="p-4 md:p-5">
            <div class="flex items-center gap-x-4">
                <div
                    class="size-10 flex justify-center items-center bg-red-100 text-red-800 rounded-lg dark:bg-red-800/20 dark:text-red-500">
                    <i data-lucide="file-text" class="size-5"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-sm font-semibold text-gray-800 dark:text-white truncate">
                        PV_Assemblée_Generale_2025.pdf</h4>
                    <p class="text-xs text-gray-500 dark:text-neutral-500">Ajouté le 12 Fév 2026 • 2.4 MB</p>
                </div>
                <a class="size-8 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800"
                    href="#">
                    <i data-lucide="download" class="size-4"></i>
                </a>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
