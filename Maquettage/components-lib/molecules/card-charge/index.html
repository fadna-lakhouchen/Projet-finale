<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Card Charge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 max-w-sm">

    <h2 class="text-xl font-semibold mb-6 border-b pb-2">Molecule: Card Charge</h2>

    <!-- Facture/Charge Card -->
    <div
        class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden group hover:border-blue-200 transition-colors">
        <!-- Header -->
        <div class="px-5 py-4 border-b border-gray-50 flex justify-between items-start">
            <div>
                <h3 class="text-base font-semibold text-gray-900">Charges Syndicales T1</h3>
                <p class="text-xs text-gray-500 mt-1 flex items-center">
                    <i data-lucide="calendar" class="w-3 h-3 mr-1"></i> Échéance: 15 Mars 2026
                </p>
            </div>
            <span
                class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 border border-red-200">
                Impayé
            </span>
        </div>

        <!-- Body -->
        <div class="px-5 py-4">
            <div class="flex items-end gap-2 mb-4">
                <span class="text-3xl font-bold text-gray-900 tracking-tight">1 200</span>
                <span class="text-sm font-medium text-gray-500 mb-1">MAD</span>
            </div>

            <!-- Actions -->
            <div class="flex gap-2">
                <button
                    class="flex-1 inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg shadow-sm hover:bg-blue-700 transition-colors focus:ring-4 focus:ring-blue-100">
                    Payer maintenant
                </button>
                <button
                    class="inline-flex items-center justify-center p-2 text-gray-500 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors tooltip-trigger"
                    title="Télécharger le reçu">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
