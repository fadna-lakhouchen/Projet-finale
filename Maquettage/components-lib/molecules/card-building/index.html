<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Card Building </title>
    
    <!-- Tailwind & Preline -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Outfit', 'Plus Jakarta Sans', 'Inter', 'sans-serif'] 
                    },
                    colors: { 
                        primary: { 
                            50: '#f5f7ff', 
                            100: '#ebf0fe', 
                            200: '#ced9fd', 
                            300: '#b1c2fb', 
                            400: '#7694f8', 
                            500: '#3b66f5', 
                            600: '#2c4db8', 
                            700: '#1d3278', 
                            800: '#152559', 
                            900: '#0e193c' 
                        },
                        slate: {
                            950: '#090D16'
                        }
                    },
                    boxShadow: {
                        'premium': '0 10px 30px -10px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.05)',
                        'premium-hover': '0 20px 40px -15px rgba(59, 102, 245, 0.25), 0 1px 2px rgba(59, 102, 245, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.35);
        }
    </style>

</head>

<body class="p-8 bg-[#080B11] text-slate-200 min-h-screen font-sans max-w-sm dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4 dark:text-white">Card Building </h2>

    <div
        class="flex flex-col bg-white border shadow-sm rounded-xl overflow-hidden hover:shadow-md transition dark:bg-neutral-900 dark:border-neutral-700 dark:shadow-neutral-700/70">
        <img class="w-full h-48 object-cover"
            src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1470&auto=format&fit=crop"
            alt="Building Image">
        <div class="p-4 md:p-5">
            <h3 class="text-lg font-bold text-gray-800 dark:text-white">
                Résidence Al-Amal
            </h3>
            <p class="mt-1 text-xs text-gray-500 flex items-center gap-x-1 dark:text-neutral-500">
                <i data-lucide="map-pin" class="size-3"></i>
                123 Avenue Mohammed V, Casa
            </p>

            <div class="mt-4 pt-4 border-t border-gray-100 grid grid-cols-2 gap-x-4 dark:border-neutral-800">
                <div>
                    <span class="block text-[10px] uppercase font-bold text-gray-400 dark:text-neutral-500">Fonds
                        Dispo</span>
                    <span class="block text-sm font-semibold text-gray-800 dark:text-neutral-200">14,200 MAD</span>
                </div>
                <div>
                    <span
                        class="block text-[10px] uppercase font-bold text-gray-400 dark:text-neutral-500">Statut</span>
                    <span class="block text-sm font-semibold text-red-600 dark:text-red-500">3 Tickets</span>
                </div>
            </div>

            <div class="mt-5">
                <a class="py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-primary-500 text-white hover:bg-primary-600 disabled:opacity-50 disabled:pointer-events-none"
                    href="#">
                    Voir détails
                </a>
            </div>
        </div>
    </div>

        <script>
        lucide.createIcons();
        window.addEventListener('load', () => {
            if (window.HSStaticMethods) {
                window.HSStaticMethods.autoInit();
            }
        });
    </script>
</body>

</html>
