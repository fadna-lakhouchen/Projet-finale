<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Card Building</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 max-w-sm">

    <h2 class="text-xl font-semibold mb-6 border-b pb-2">Molecule: Card Building</h2>

    <!-- Immeuble Vue Globale Card -->
    <div
        class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden group hover:shadow-md transition-shadow">
        <!-- Image (placeholder) -->
        <div class="h-40 bg-gray-200 relative">
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1470&auto=format&fit=crop"
                alt="Immeuble Al-Amal" class="w-full h-full object-cover">
            <!-- Badge Nb Unités -->
            <div
                class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-semibold text-gray-800 shadow-sm flex items-center gap-1.5">
                <i data-lucide="door-open" class="w-3 h-3 text-blue-600"></i> 45 Lots
            </div>
        </div>

        <!-- Informations -->
        <div class="p-5">
            <h3 class="text-lg font-bold text-gray-900 group-hover:text-blue-600 transition-colors">Résidence Al-Amal
            </h3>
            <p class="text-sm text-gray-500 flex items-center gap-1 mt-1.5 mb-4">
                <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i>
                123 Avenue Mohammed V, Casa
            </p>

            <!-- Stats Rapides -->
            <div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-100">
                <div>
                    <p class="text-[10px] uppercase font-semibold text-gray-400 tracking-wider">Fonds Dispo</p>
                    <p class="text-sm font-bold text-gray-900 mt-0.5">14,200 MAD</p>
                </div>
                <div>
                    <p class="text-[10px] uppercase font-semibold text-gray-400 tracking-wider">Tickets Ouverts</p>
                    <p class="text-sm font-medium text-red-600 mt-0.5">3 En attente</p>
                </div>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>

</html>
