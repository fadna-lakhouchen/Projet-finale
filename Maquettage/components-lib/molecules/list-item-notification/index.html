<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: List Item Notification </title>
    
    <!-- Tailwind & Preline -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Outfit', 'Plus Jakarta Sans', 'Inter', 'sans-serif'] 
                    },
                    colors: { 
                        primary: { 
                            50: '#f5f7ff', 
                            100: '#ebf0fe', 
                            200: '#ced9fd', 
                            300: '#b1c2fb', 
                            400: '#7694f8', 
                            500: '#3b66f5', 
                            600: '#2c4db8', 
                            700: '#1d3278', 
                            800: '#152559', 
                            900: '#0e193c' 
                        },
                        slate: {
                            950: '#090D16'
                        }
                    },
                    boxShadow: {
                        'premium': '0 10px 30px -10px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.05)',
                        'premium-hover': '0 20px 40px -15px rgba(59, 102, 245, 0.25), 0 1px 2px rgba(59, 102, 245, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.35);
        }
    </style>

</head>

<body class="p-8 bg-[#080B11] text-slate-200 min-h-screen font-sans max-w-lg dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4 dark:text-white">List Item Notification </h2>

    <div
        class="flex flex-col bg-white border shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 dark:shadow-neutral-700/70">
        <div class="p-4 md:p-5">
            <ul class="flex flex-col divide-y divide-gray-200 dark:divide-neutral-700">
                <!-- Non lue -->
                <li
                    class="inline-flex flex-col gap-2 py-3 px-4 bg-primary-500/10/50 hover:bg-primary-500/10 transition dark:bg-blue-900/10 dark:hover:bg-blue-900/20">
                    <div class="flex justify-between">
                        <div class="flex gap-x-3">
                            <span
                                class="size-8 flex justify-center items-center rounded-full bg-primary-500/20 text-primary-500 dark:bg-blue-900 dark:text-primary-500">
                                <i data-lucide="info" class="size-4"></i>
                            </span>
                            <div class="grow">
                                <span class="block text-sm font-semibold text-gray-800 dark:text-neutral-200">Rappel de
                                    paiement</span>
                                <span class="block text-xs text-gray-500 dark:text-neutral-500">N'oubliez pas que
                                    l'échéance pour les charges du Trimestre 2 approche.</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="size-2 bg-primary-500 rounded-full"></span>
                            <span class="mt-2 text-[10px] text-gray-400 dark:text-neutral-600">2h</span>
                        </div>
                    </div>
                </li>

                <!-- Lue -->
                <li class="inline-flex flex-col gap-2 py-3 px-4 hover:bg-gray-50 transition dark:hover:bg-neutral-800">
                    <div class="flex justify-between">
                        <div class="flex gap-x-3">
                            <span
                                class="size-8 flex justify-center items-center rounded-full bg-gray-100 text-gray-500 dark:bg-neutral-800 dark:text-neutral-500">
                                <i data-lucide="wrench" class="size-4"></i>
                            </span>
                            <div class="grow">
                                <span class="block text-sm font-medium text-gray-800 dark:text-neutral-200">Intervention
                                    terminée</span>
                                <span class="block text-xs text-gray-500 dark:text-neutral-500">Le plombier a réparé la
                                    fuite signalée. Le dossier #INT-202 est clos.</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-[10px] text-gray-400 dark:text-neutral-600">Hier</span>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

        <script>
        lucide.createIcons();
        window.addEventListener('load', () => {
            if (window.HSStaticMethods) {
                window.HSStaticMethods.autoInit();
            }
        });
    </script>
</body>

</html>
