<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molecule: Pagination</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 flex flex-col gap-6 items-start">

    <h2 class="text-xl font-semibold mb-6 border-b pb-2 w-full">Molecule: Pagination</h2>

    <nav aria-label="Navigation des pages"
        class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6 w-full max-w-lg rounded-lg shadow-sm">
        <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
            <div>
                <p class="text-sm text-gray-700">
                    Affichage de <span class="font-medium">1</span> à <span class="font-medium">10</span> sur <span
                        class="font-medium">97</span> résultats
                </p>
            </div>
            <div>
                <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">

                    <!-- Précédent (Désactivé) -->
                    <a href="#"
                        class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0 disabled pointer-events-none">
                        <span class="sr-only">Précédent</span>
                        <i data-lucide="chevron-left" class="h-5 w-5"></i>
                    </a>

                    <!-- Page 1 (Active) -->
                    <a href="#" aria-current="page"
                        class="relative z-10 inline-flex items-center bg-blue-600 px-4 py-2 text-sm font-semibold text-white focus:z-20 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">1</a>

                    <!-- Page 2 -->
                    <a href="#"
                        class="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0">2</a>

                    <!-- Page 3 -->
                    <a href="#"
                        class="relative hidden items-center px-4 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0 md:inline-flex">3</a>

                    <!-- Ellipsis -->
                    <span
                        class="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-gray-700 ring-1 ring-inset ring-gray-300 focus:outline-offset-0">...</span>

                    <!-- Page 10 -->
                    <a href="#"
                        class="relative hidden items-center px-4 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0 md:inline-flex">10</a>

                    <!-- Suivant -->
                    <a href="#"
                        class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0 hover:text-gray-600">
                        <span class="sr-only">Suivant</span>
                        <i data-lucide="chevron-right" class="h-5 w-5"></i>
                    </a>
                </nav>
            </div>
        </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>

</html>
