<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molecule: User Profile Badge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 max-w-sm">

    <h2 class="text-xl font-semibold mb-6 border-b pb-2">Molecule: User Profile Badge</h2>

    <!-- Pour Header / Sidebar (Cliqueable) -->
    <button
        class="flex items-center w-full p-2 rounded-lg hover:bg-gray-100 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 text-left">
        <img class="w-10 h-10 rounded-full object-cover ring-2 ring-white shadow-sm"
            src="https://ui-avatars.com/api/?name=Ahmed+Benali&background=0D8ABC&color=fff" alt="User Image">
        <div class="ml-3 flex-1 overflow-hidden">
            <p class="text-sm font-medium text-gray-900 truncate">Ahmed Benali</p>
            <p class="text-xs text-gray-500 truncate">Résident - Appt 12</p>
        </div>
        <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 flex-shrink-0 ml-2"></i>
    </button>

    <script>lucide.createIcons();</script>
</body>

</html>
