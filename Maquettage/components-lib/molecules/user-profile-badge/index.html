<!DOCTYPE html>
<html lang="fr" class="light">

<head>
    <meta charset="UTF-8">
    <title>Molecule: User Profile Badge </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="p-8 bg-gray-50 max-w-sm dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4 dark:text-white">User Profile Badge </h2>

    <button type="button"
        class="w-full text-start flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-300 dark:focus:bg-neutral-800">
        <img class="shrink-0 size-10 rounded-full"
            src="https://ui-avatars.com/api/?name=Ahmed+Benali&background=0D8ABC&color=fff" alt="Avatar">
        <div class="grow">
            <span class="block text-sm font-semibold text-gray-800 dark:text-neutral-200">Ahmed Benali</span>
            <span class="block text-xs text-gray-500 dark:text-neutral-500">Résident - Appt 12</span>
        </div>
        <i data-lucide="chevron-down" class="shrink-0 size-4 text-gray-400"></i>
    </button>

    <script>lucide.createIcons();</script>
</body>

</html>
