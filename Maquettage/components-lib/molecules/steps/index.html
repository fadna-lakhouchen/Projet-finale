<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Steps </title>
    
    <!-- Tailwind & Preline -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Outfit', 'Plus Jakarta Sans', 'Inter', 'sans-serif'] 
                    },
                    colors: { 
                        primary: { 
                            50: '#f5f7ff', 
                            100: '#ebf0fe', 
                            200: '#ced9fd', 
                            300: '#b1c2fb', 
                            400: '#7694f8', 
                            500: '#3b66f5', 
                            600: '#2c4db8', 
                            700: '#1d3278', 
                            800: '#152559', 
                            900: '#0e193c' 
                        },
                        slate: {
                            950: '#090D16'
                        }
                    },
                    boxShadow: {
                        'premium': '0 10px 30px -10px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.05)',
                        'premium-hover': '0 20px 40px -15px rgba(59, 102, 245, 0.25), 0 1px 2px rgba(59, 102, 245, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.35);
        }
    </style>

</head>

<body class="p-8 bg-[#080B11] text-slate-200 min-h-screen font-sans max-w-lg dark:bg-neutral-900">

    <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4 dark:text-white">Steps / Stepper </h2>

    <ul class="relative flex flex-row gap-x-2">
        <!-- Item -->
        <li class="flex items-center gap-x-2 shrink basis-0 flex-1 group">
            <div class="min-w-7 min-h-7 inline-flex justify-center items-center text-xs align-middle">
                <span
                    class="size-7 flex justify-center items-center shrink-0 bg-primary-500 font-medium text-white rounded-full dark:bg-primary-500/100">
                    1
                </span>
                <span class="ms-2 block text-sm font-medium text-gray-800 dark:text-white">Détails</span>
            </div>
            <div class="w-full h-px flex-1 bg-gray-200 group-last:hidden dark:bg-neutral-700"></div>
        </li>
        <!-- Item -->
        <li class="flex items-center gap-x-2 shrink basis-0 flex-1 group">
            <div class="min-w-7 min-h-7 inline-flex justify-center items-center text-xs align-middle">
                <span
                    class="size-7 flex justify-center items-center shrink-0 bg-gray-100 font-medium text-gray-800 rounded-full dark:bg-neutral-700 dark:text-white">
                    2
                </span>
                <span class="ms-2 block text-sm font-medium text-gray-500 dark:text-neutral-500">Photos</span>
            </div>
            <div class="w-full h-px flex-1 bg-gray-200 group-last:hidden dark:bg-neutral-700"></div>
        </li>
        <!-- Item -->
        <li class="flex items-center gap-x-2 shrink basis-0 flex-1 group">
            <div class="min-w-7 min-h-7 inline-flex justify-center items-center text-xs align-middle">
                <span
                    class="size-7 flex justify-center items-center shrink-0 bg-gray-100 font-medium text-gray-800 rounded-full dark:bg-neutral-700 dark:text-white">
                    3
                </span>
                <span class="ms-2 block text-sm font-medium text-gray-500 dark:text-neutral-500">Validation</span>
            </div>
            <div class="w-full h-px flex-1 bg-gray-200 group-last:hidden dark:bg-neutral-700"></div>
        </li>
    </ul>

        <script>
        lucide.createIcons();
        window.addEventListener('load', () => {
            if (window.HSStaticMethods) {
                window.HSStaticMethods.autoInit();
            }
        });
    </script>
